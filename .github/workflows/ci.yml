name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token (defends against compromised-action escalation).
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · format · types · tests
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are SHA-pinned (tag in comment) per supply-chain
      # hygiene; bump the SHA and comment together when upgrading.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # PyAudio (via pipecat-ai[local]) builds against portaudio headers.
      - name: Install audio system deps
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --locked fails the build if uv.lock is stale vs pyproject.toml.
      # No --extra pi: the mock hardware backend is the CI default.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      # The CAM++ speaker model is gitignored (~28 MB); provision it (cached by its
      # pinned sha256) so the model-gated embedder tests — incl. the featurization
      # golden gate — actually run in CI instead of skipping.
      - name: Cache CAM++ speaker model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/models
          # Keyed on the module that pins the model URL + sha256, so the cache
          # busts when the pinned model changes; restore-keys reuses a prior cache
          # otherwise (fetch-models re-verifies the checksum, so a stale hit is safe).
          key: campplus-onnx-${{ hashFiles('src/larry/speaker_embedder.py') }}
          restore-keys: |
            campplus-onnx-

      - name: Fetch speaker-embedder model
        run: uv run larry fetch-models

      - name: Tests
        run: uv run pytest
