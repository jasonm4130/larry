[project]
name = "larry"
dynamic = ["version"]
description = "Cursed AI character in a Halloween skull on a Raspberry Pi 5."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "jasonm4130", email = "jasonm4130@gmail.com" }]

dependencies = [
    "pipecat-ai[anthropic,elevenlabs,groq,silero,mem0,local]>=1.3.0",
    "openwakeword>=0.4.0",
    "sounddevice>=0.5.5",
    "numpy>=2.5.2",
    "python-dotenv>=1.2.2",
    "resemblyzer>=0.1.4",
    "gpiozero>=2.0.1",
    "fastembed>=0.8.0",
    "pywebrtc-audio>=0.1.0",
    "kaldi-native-fbank>=1.22.3",
    "onnxruntime>=1.24.4",
]

[project.optional-dependencies]
pi = [
    "lgpio",
    "adafruit-circuitpython-pca9685",
    "adafruit-circuitpython-servokit",
    "adafruit-blinka",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pyright",
    "pre-commit",
]

[project.scripts]
larry = "larry.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/larry/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/larry"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=larry --cov-report=term-missing"

[tool.coverage.run]
# Drivers / entrypoint / CLI are integration-only; exclude from the core-logic number.
omit = [
    "*/larry/__main__.py",
    "*/larry/cli/*",
    "*/larry/hardware/jaw_pca9685.py",
]
